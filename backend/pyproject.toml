[project]
name = "sparetwin"
version = "1.2.0"
description = "SpareTwin API — dijital parça ikizi platformu"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "psycopg[binary]==3.2.6",
  "psycopg-pool==3.2.6",
  "pydantic==2.10.6",
  "pydantic-settings==2.8.1",
  "pyjwt==2.10.1",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.20",
  "boto3==1.37.0",
  "segno==1.6.1",
  "pillow==11.1.0",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "moto[s3]==5.1.1",
  "pypdf==5.1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sparetwin*"]

[tool.setuptools.package-data]
# Rapor yazı tipleri (SIL Open Font License) Docker imajına da girsin
sparetwin = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
